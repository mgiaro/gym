<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corpo Libero di Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corpo Libero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a una colonna per telefono, schede in basso, guida e timer a schermo intero come un tabellone da palestra */
:root{
  --bg:#141218; --surface:#1e1b24; --surface2:#29252f; --line:#3a3442;
  --fg:#f3eef6; --muted:#a99fb3; --accent:#ff9f6b; --accent-ink:#2a1408;
  --cool:#7fd1c7; --warm:#f2c66d; --limb2:#7d7189; --prop:#5b5366;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text]{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.display{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:.95}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* figura animata */
svg.fig{display:block;width:100%;height:auto}
.fig .fl{stroke:var(--line);stroke-width:1.5}
.fig .lf{stroke:var(--limb2);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .ln{stroke:var(--fg);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:var(--fg)}
.fig .pr{stroke:var(--prop);stroke-width:2.5}
.fig .pr2{stroke:var(--prop);stroke-width:2;fill:none;opacity:.6}
.fig .pb{fill:var(--prop)}
.fig .pbar{fill:var(--muted)}
.fig .strap{stroke:var(--muted);stroke-width:1.5}
.fig .ring{fill:none;stroke:var(--accent);stroke-width:2.2}
.fig .kb circle{fill:var(--accent)}
.fig .kb path{stroke:var(--accent);stroke-width:2.5}
.stage{background:var(--surface);border-radius:18px;padding:8px 8px 4px}

/* testata */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:44px;text-transform:uppercase}
.who{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);font-weight:600;font-size:15px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.date{color:var(--muted);font-size:14px}

.quote{background:var(--surface);border-radius:18px;padding:18px 18px 16px;position:relative}
.quote p{margin:6px 0 0;font-size:19px;font-weight:600;line-height:1.35;padding-right:56px}
.quote button{position:absolute;top:12px;right:12px;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:8px}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;background:var(--surface);font-size:12px;color:var(--muted)}
.day b{font-family:var(--display);font-size:20px;color:var(--fg);font-weight:600}
.day.rest b{color:var(--muted)}
.day.today{box-shadow:inset 0 0 0 1px var(--line)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] b{color:var(--accent-ink)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--cool);opacity:0}
.day .dot.on{opacity:1}
.day[aria-pressed="true"] .dot{background:var(--accent-ink)}

.session h2{font-size:34px;text-transform:uppercase}
.session .focus{color:var(--muted);margin-top:4px}

.dur{background:var(--surface);border-radius:18px;padding:16px 18px}
.dur .val{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.dur .val small{font-size:22px;font-weight:600;color:var(--muted);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg)}
.sr{position:absolute;left:-9999px}

.plan{display:flex;flex-direction:column}
.blk{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .t{font-family:var(--display);font-size:22px;font-weight:600}
.blk .t span{display:block;font-family:var(--body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.blk.w .t span{color:var(--warm)} .blk.m .t span{color:var(--accent)} .blk.c .t span{color:var(--cool)}
.blk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.blk li button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:4px 0}
.blk li button span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.blk li em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap}
.blk .fmt{color:var(--muted);font-size:13px;margin-bottom:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:18px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.small{padding:12px;font-size:15px;border-radius:12px}
.btn.danger{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}

.card{background:var(--surface);border-radius:18px;padding:20px}
.card h2{font-size:30px;text-transform:uppercase;margin-bottom:6px}
.card ul{margin:10px 0 0;padding-left:18px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* guida esercizi */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -4px;padding-left:4px}
.filters .chip{white-space:nowrap}
.cat h3{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:800;margin-bottom:8px}
.exrow{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:6px 14px 6px 6px;margin-bottom:8px}
.exrow .th{background:var(--surface2);border-radius:10px;overflow:hidden}
.exrow b{display:block}
.exrow .sub{font-size:14px;color:var(--muted)}
.exrow .lv{font-size:12px;color:var(--muted);white-space:nowrap}

/* scheda dettaglio */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:560px;margin:0 auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.sheet .bar{display:flex;justify-content:space-between;align-items:center}
.back{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;padding:8px 0}
.sheet h2{font-size:40px;text-transform:uppercase}
.var{color:var(--accent);font-weight:700;font-size:18px}
.speed{display:flex;gap:6px}
.speed .chip{font-size:13px;padding:5px 10px}
.sec h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);line-height:1.1}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.checks li::before{content:"";width:14px;height:14px;margin-top:4px;border-radius:4px;background:var(--cool)}
.checks.no li::before{background:transparent;border:2px solid var(--accent);border-radius:50%}
.resp{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15px}
.prog{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.prog li button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:15px}
.prog li button i{font-style:normal;font-family:var(--display);font-weight:600}
.prog li.cur button{color:var(--fg);font-weight:600;background:var(--surface)}
.prog li.cur button i{color:var(--accent)}
.prog li.view button{box-shadow:inset 0 0 0 1px var(--accent)}
.prog small{font-size:12px;color:var(--accent);align-self:center}
.lvbtns{display:flex;gap:8px}
.lvbtns button{flex:1;padding:12px;border-radius:10px;background:var(--surface2);font-size:14px;font-weight:600}
.lvbtns button:disabled{opacity:.35}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);margin:0 4px 4px 0}

/* diario */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.chart{background:var(--surface);border-radius:14px;padding:14px}
.chart svg{width:100%;height:auto;display:block}
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.entry .d{font-family:var(--display);font-size:24px;font-weight:600;line-height:1;text-align:center}
.entry .d small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.entry .f{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.empty{background:var(--surface);border-radius:14px;padding:20px;color:var(--muted)}
details.box{background:var(--surface);border-radius:14px}
details.box summary{list-style:none;display:flex;justify-content:space-between;padding:14px 16px;cursor:pointer}
details.box summary::-webkit-details-marker{display:none}
details.box .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.box .body p{margin:0;color:var(--muted)}
textarea{width:100%;min-height:90px;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.note{font-size:13px;color:var(--muted)}

/* profili */
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:12px}
.pitem .av{width:40px;height:40px;font-size:22px}
.pitem.on{box-shadow:inset 0 0 0 2px var(--accent)}
.pitem .meta{flex:1;min-width:0}
.pitem .meta span{display:block;font-size:13px;color:var(--muted)}
.levels{display:flex;flex-direction:column;gap:8px}
.levels button{text-align:left;padding:14px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.levels button span{font-size:14px;color:var(--muted)}
.levels button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.confirm{background:var(--surface2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* lettore */
.player{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player .pbar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;flex:none}
.player .pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.player .ph{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--muted);flex:none}
.player .main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;min-height:0}
.player .pfig{width:100%;max-width:380px;min-height:0;flex:0 1 auto}
.player .pfig svg{max-height:30vh;margin:0 auto}
.phase{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding:4px 12px;border-radius:999px}
.phase.work{background:var(--accent);color:var(--accent-ink)}
.phase.rest{background:var(--cool);color:#0d2422}
.phase.warm{background:var(--warm);color:#2a1f05}
.phase.cool{background:var(--cool);color:#0d2422}
.clock{font-family:var(--display);font-weight:800;font-size:min(30vw,150px);line-height:.9;font-variant-numeric:tabular-nums}
.exname{font-size:24px;font-weight:700;line-height:1.15;max-width:24ch}
.target{font-size:17px;color:var(--accent);font-weight:600}
.cue{color:var(--muted);max-width:36ch;font-size:15px}
.guide{font-size:14px;color:var(--fg);padding:6px 12px;border-radius:999px;background:var(--surface2);font-weight:600}
.next{background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:15px;flex:none}
.next span{color:var(--muted)}
.ctrls{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;margin-top:10px;flex:none}
.ctrls button{padding:16px 0;border-radius:14px;background:var(--surface2);font-weight:700}
.ctrls .pp{background:var(--accent);color:var(--accent-ink);font-size:18px}
.close{color:var(--muted);font-size:14px;padding:6px 0;flex:none}
.fb{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.fb button{padding:16px;border-radius:14px;background:var(--surface);font-weight:600;font-size:17px;text-align:left;display:flex;justify-content:space-between}
.fb button span{color:var(--muted);font-weight:400;font-size:14px}
@media (prefers-reduced-motion:reduce){.player .pbar i{transition:none}}
</style>
</head>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sezioni" hidden>
  <button data-tab="oggi" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Oggi</button>
  <button data-tab="settimana"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Settimana</button>
  <button data-tab="guida"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.5v6M12 13.5l-4 7M12 13.5l4 7M6 10l6-1 6 1"/></svg>Guida</button>
  <button data-tab="diario"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Diario</button>
</nav>
<div class="player" id="player" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<script>
// Corpo Libero — figura animata (vista laterale, coordinate SVG 200x130, y verso il basso)
(function(root){
const G=118, GA=115;           // pavimento, caviglia a terra
const L={T:34,NECK:3,HR:7,UA:17,FA:16,TH:22,SH:21};
const R=Math.PI/180;
const dir=d=>[Math.cos(d*R),Math.sin(d*R)];
const add=(p,v,s=1)=>[p[0]+v[0]*s,p[1]+v[1]*s];
const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])/R;

function ik(A,T,l1,l2,s){
  let d=dist(A,T); const base=Math.atan2(T[1]-A[1],T[0]-A[0]);
  d=Math.min(d,l1+l2-0.01); d=Math.max(d,Math.abs(l1-l2)+0.01);
  const off=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d));
  const a=base+s*off;
  return [[A[0]+l1*Math.cos(a),A[1]+l1*Math.sin(a)],[A[0]+d*Math.cos(base),A[1]+d*Math.sin(base)]];
}

// ---------- costruttori di pose ----------
// corpo dritto da un punto d'appoggio (caviglia) con inclinazione deg sopra l'orizzontale, verso destra
function line(ax,deg,ay=GA){const v=dir(-deg);const h=add([ax,ay],v,L.TH+L.SH);return {h,t:-deg,sh:add(h,v,L.T)};}
// corpo dritto dal ginocchio a terra
function kline(kx,deg){const v=dir(-deg);const k=[kx,G-2];const h=add(k,v,L.TH);return {h,t:-deg,sh:add(h,v,L.T),k};}
const stand=(x=100,o={})=>Object.assign({h:[x,72],t:-90,fN:[x+2,GA],fF:[x-2,GA],aN:[x+3,70],aF:[x-3,70]},o);
const sh=p=>add(p.h,dir(p.t),L.T);

// ---------- libreria di animazioni ----------
const A={};
const def=(k,o)=>{A[k]=Object.assign({dur:1.6,hold:.35},o);};

// Piegamenti
(()=>{ // completi
  const a=line(69.5,23.7), b=line(69.5,8.2);
  const base={fN:[69.5,GA],fF:[67.5,GA],aN:[140,G-2],aF:[137,G-2]};
  def("push_full",{keys:[{...base,h:a.h,t:a.t},{...base,h:b.h,t:b.t}]});
  def("push_slow",{keys:[{...base,h:a.h,t:a.t},{...base,h:b.h,t:b.t}],durs:[3,1]});
  def("tap",{keys:[{...base,h:a.h,t:a.t},{...base,h:a.h,t:a.t,aN:add(a.sh,[-4,10])}],dur:1});
  const ca=line(69.5,23.7);
  def("climb",{keys:[{...base,h:ca.h,t:ca.t,fN:[112,108]},{...base,h:ca.h,t:ca.t,fF:[110,108]}],dur:.7,hold:.05});
})();
(()=>{ // sulle ginocchia
  const a=kline(94,34.8), b=kline(94,12.4);
  const f=k=>add(k,[-19,-9]);
  def("push_knee",{keys:[{h:a.h,t:a.t,fN:f(a.k),fF:add(f(a.k),[-2,0]),aN:[142,G-2],aF:[139,G-2]},{h:b.h,t:b.t,fN:f(b.k),fF:add(f(b.k),[-2,0]),aN:[142,G-2],aF:[139,G-2]}]});

function frame(key,t){ // t in secondi
  const a=A[key]; if(!a) return "";
  const keys=a.keys, n=keys.length;
  const durs=a.durs||keys.map(()=>a.dur);
  const seg=i=>(durs[i%durs.length])+a.hold;
  const loopN=a.loop||n>2?n:2*(n-1);
  // sequenza: andata e ritorno per due pose, ciclo per tre o più
  const order=[];for(let i=0;i<loopN;i++) order.push(a.loop||n>2?i%n:(i<n?i:2*(n-1)-i));
  let total=0;const spans=order.map((_,i)=>{const d=seg(i);total+=d;return d;});
  let x=t%total,i=0;while(x>spans[i]){x-=spans[i];i++;}
  const from=keys[order[i]], to=keys[order[(i+1)%order.length]];

// ================= generatore seduta =================
function build(key,min){
 const d=SED[key], total=min*60;
 const warm = min<=10?90:min<=20?180:240;
 const cool = min<=10?60:min<=20?120:180;
 const isMob = key==="mobile";
 const base = isMob?40:(min<=10?30:40), rest = isMob?15:20, roundRest=60;
 let ex=d.ex.slice(); if(min<=10) ex=ex.slice(0,4);
 const n=ex.length, main=total-warm-cool;
 const fitOf=r=>(main-r*(n-1)*rest-(r-1)*roundRest)/(r*n);
 let rounds=1;
 for(let r=1;r<=8;r++){const f=fitOf(r);if(f>=25&&Math.abs(f-base)<Math.abs(fitOf(rounds)-base))rounds=r;}
 const work=Math.max(25,Math.min(60,Math.floor(fitOf(rounds)/5)*5));
 const steps=[];
 const wl=WARM.slice(0,min<=10?3:4), wd=Math.round(warm/wl.length);
 wl.forEach(id=>steps.push({k:"warm",id,d:wd}));
 for(let r=0;r<rounds;r++) ex.forEach((id,i)=>{
   steps.push({k:"work",id,d:work,round:r+1,rounds});
   if(i<n-1) steps.push({k:"rest",d:rest});
   else if(r<rounds-1) steps.push({k:"rest",d:roundRest,long:true});
 });
 const cl=COOL.slice(0,min<=10?2:min<=20?3:4), cd=Math.round(cool/cl.length);
 cl.forEach(id=>steps.push({k:"cool",id,d:cd}));
 return {key,title:d.title,focus:d.focus,steps,rounds,work,rest,ex,warm,cool,wl,cl,secs:steps.reduce((a,s)=>a+s.d,0)};
}

function figSvg(a,live,label){

}
let t0=performance.now();
function loop(n){
 const t=(n-t0)/1000*speed;
 document.querySelectorAll("svg[data-anim]").forEach(el=>{
  if(!el.isConnected||el.closest("[hidden]"))return;
  const a=el.dataset.anim;
  el.firstChild.innerHTML = RM ? CLAnim.pose(a,Math.floor(t/2.5)%CLAnim.A[a].keys.length) : CLAnim.frame(a,t);
 });
 requestAnimationFrame(loop);
}

function viewDiario(){
 const p=me(), ws=weekStart(now), wsS=ymd(ws);
 const week=p.log.filter(e=>e.date>=wsS).length;
 const m0=ymd(new Date(now.getFullYear(),now.getMonth(),1));
 const monthMin=Math.round(p.log.filter(e=>e.date>=m0).reduce((a,e)=>a+e.secs,0)/60);
 const weeks=[];for(let i=7;i>=0;i--){const a=new Date(ws);a.setDate(ws.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+7);
  const A=ymd(a),B=ymd(b);weeks.push({lab:a.getDate()+"/"+(a.getMonth()+1),min:Math.round(p.log.filter(e=>e.date>=A&&e.date<B).reduce((x,e)=>x+e.secs,0)/60)});}
 const top=Math.ceil(Math.max(60,...weeks.map(w=>w.min))/30)*30;
 const W=320,H=150,pl=28,pb=20,pt=12,bw=(W-pl)/8;
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minuti di allenamento nelle ultime 8 settimane">`;
 [0,top/2,top].forEach(v=>{const y=pt+(H-pt-pb)*(1-v/top);svg+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" fill="var(--muted)" font-size="10" text-anchor="end">${v}</text>`});
 weeks.forEach((w,i)=>{const h=(H-pt-pb)*(w.min/top),x=pl+i*bw+bw*.2,y=H-pb-h;
  svg+=`<rect x="${x}" y="${y}" width="${bw*.6}" height="${Math.max(h,0)}" rx="3" fill="${i===7?"var(--accent)":"var(--surface2)"}"/>`;
  if(w.min) svg+=`<text x="${x+bw*.3}" y="${y-3}" fill="var(--fg)" font-size="10" text-anchor="middle">${w.min}</text>`;
  svg+=`<text x="${x+bw*.3}" y="${H-5}" fill="var(--muted)" font-size="9" text-anchor="middle">${w.lab}</text>`;});
 svg+="</svg>";
 const FB={facile:"Facile",giusta:"Giusta",dura:"Dura"};
 const list=p.log.slice().reverse().slice(0,30).map(e=>{const d=new Date(e.date+"T12:00");

 <div class="chart"><div class="eyebrow" style="margin-bottom:8px">Minuti a settimana</div>${svg}</div>
 ${p.log.length?`<div class="log">${list}</div>`:`<div class="empty">Qui compariranno le sedute completate di ${esc(p.name)}, con durata e sensazione. Si parte dalla schermata Oggi: la prima seduta può durare anche solo 7 minuti.</div>`}

 S.profiles.push({id,name,lvl:newLvl,dur:15,levels:{},log:[]});S.cur=id;save();
 $("#sheet").hidden=true;tab="oggi";render();
}

// ================= scheda esercizio =================
let det=null; // {id, view}
function openEx(id,fromPlayer){
 det={id,view:lv(id),fromPlayer};drawEx();
}
function drawEx(){
 const e=EX[det.id], l=lv(det.id), V=e.levels[det.view], sh=$("#sheet");
 sh.hidden=false;
 sh.innerHTML=`<div class="in">
  <div class="bar"><button class="back" data-close>← ${det.fromPlayer?"Torna all'allenamento":"Indietro"}</button><span class="tag">${esc(e.cat)}</span></div>
  <div><h2 class="display">${esc(e.name)}</h2><div class="var">${esc(V.n)}${V.t?` <span class="muted" style="font-weight:500">· ${esc(V.t)}</span>`:""}</div></div>
  <div class="stage">${figSvg(V.a,true,"Animazione: "+V.n)}</div>
  <div class="row" style="justify-content:space-between"><span class="note">Velocità</span><div class="speed">${[[.5,"Lenta"],[1,"Normale"]].map(([v,t])=>`<button class="chip ${speed===v?"on":""}" data-speed="${v}">${t}</button>`).join("")}</div></div>
  <p style="margin:0">${esc(e.how)}</p>
  <div class="sec"><h3>Come si fa</h3><ol class="steps">${e.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol></div>
  <div class="sec"><h3>Cosa curare</h3><ul class="checks">${e.cura.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ul></div>
  <div class="sec"><h3>Errori da evitare</h3><ul class="checks no">${e.evita.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ul></div>
  <div class="resp"><b>Respiro.</b> ${esc(e.resp)}</div>
  <div>${e.eq.map(q=>`<span class="tag">${esc(q)}</span>`).join("")}</div>
  ${e.levels.length>1?`<div class="sec"><h3>Varianti, dalla più facile</h3><ol class="prog">${e.levels.map((L,i)=>`<li class="${i===l?"cur":""} ${i===det.view&&i!==l?"view":""}"><button data-view="${i}"><i>${i+1}</i><span>${esc(L.n)} <span class="muted">· ${esc(L.t)}</span></span>${i===l?"<small>attuale</small>":""}</button></li>`).join("")}</ol>
   <p class="note" style="margin:8px 0">Tocca una variante per vederla. ${det.view!==l?"":"Questa è quella di "+esc(me().name)+"."}</p>
   ${det.view!==l?`<button class="btn small" data-setlv="${det.view}">Usa questa variante per ${esc(me().name)}</button>`:`<div class="lvbtns"><button data-step="-1" ${l===0?"disabled":""}>Più facile</button><button data-step="1" ${l===e.levels.length-1?"disabled":""}>Più difficile</button></div>`}</div>`:""}
 </div>`;
}
function closeSheet(){
 $("#sheet").hidden=true; const wasEx=det; det=null; askDel=null;
 if(wasEx&&wasEx.fromPlayer&&P){drawPlayer();return;}
 render();
}

function render(){
 const has=S.profiles.length>0;
 $("#tabs").hidden=!has;
 if(!has){$("#app").innerHTML=`<div class="stack">${viewBenvenuto()}</div>`;return;}
 if(!me())S.cur=S.profiles[0].id;
 const v={oggi:viewOggi,settimana:viewSettimana,guida:viewGuida,diario:viewDiario}[tab]();
 $("#app").innerHTML=`<div class="stack">${v}</div>`;
 document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
}

// ================= eventi =================
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 const d=t.dataset;
 if(d.tab){tab=d.tab;render();scrollTo(0,0);return;}
 if(d.day){selDay=+d.day;render();return;}
 if(d.dur){me().dur=+d.dur;save();render();return;}
 if(t.id==="nextq"){qi=(qi+1)%FRASI.length;render();return;}
 if(d.filt){filt=d.filt;render();return;}
 if(d.open){openEx(d.open,false);return;}
 if(d.close!==undefined){closeSheet();return;}
 if(d.view){det.view=+d.view;drawEx();return;}
 if(d.setlv){setLv(det.id,+d.setlv);det.view=lv(det.id);drawEx();return;}
 if(d.step){setLv(det.id,lv(det.id)+ +d.step);det.view=lv(det.id);drawEx();return;}
 if(d.speed){speed=+d.speed;t0=performance.now();drawEx();return;}
 if(t.id==="who"){askDel=null;openProfiles();return;}
 if(d.pick){S.cur=d.pick;save();$("#sheet").hidden=true;render();return;}
 if(d.newlvl){newLvl=d.newlvl;document.querySelectorAll("[data-newlvl]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.newlvl===newLvl));return;}
 if(t.id==="addp"){addProfile();return;}
 if(d.askdel){askDel=d.askdel;openProfiles();return;}
 if(d.nodel!==undefined){askDel=null;openProfiles();return;}
 if(d.dodel){S.profiles=S.profiles.filter(p=>p.id!==d.dodel);if(S.cur===d.dodel)S.cur=S.profiles[0]?.id||null;askDel=null;save();openProfiles();render();return;}
 if(t.id==="start"){startPlayer();return;}
 if(t.id==="exp"){const txt=JSON.stringify(S);const ta=$("#imp");
  const fall=()=>{ta.value=txt;ta.select();$("#msg").textContent="Testo selezionato qui sopra: copialo e salvalo in una nota o in un messaggio.";};
  try{navigator.clipboard.writeText(txt).then(()=>{$("#msg").textContent="Dati copiati. Salvali in una nota o in un messaggio.";}).catch(fall);}catch(err){fall();}
  return;}
 if(t.id==="impb"){try{const o=JSON.parse($("#imp").value);
   if(o&&Array.isArray(o.profiles)){S=Object.assign({v:2,cur:null,profiles:[]},o);}
   else if(o&&Array.isArray(o.log)){const id="p"+Date.now().toString(36);S.profiles.push({id,name:"Profilo importato",lvl:"medio",dur:o.dur||15,levels:o.levels||{},log:o.log});S.cur=id;}
   else throw 0; save();render();}
  catch(err){$("#msg").textContent="Il testo incollato non è una copia valida. Ricopialo per intero e riprova.";}return;}
});
document.addEventListener("input",e=>{if(e.target.id==="durr"){me().dur=+e.target.value;$("#durval").innerHTML=me().dur+"<small>min</small>";save();}});
document.addEventListener("change",e=>{if(e.target.id==="durr")render();});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pname")addProfile();});

// ================= lettore =================
let P=null, ac=null, wake=null;
function beep(f=880,ms=140){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
 g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+ms/1000);o.start();o.stop(ac.currentTime+ms/1000+.02);}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function lock(){try{if("wakeLock" in navigator)wake=await navigator.wakeLock.request("screen");}catch(e){}}
function startPlayer(){
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();}catch(e){}
 lock();
 const s=build(WEEK[selDay],me().dur);
 P={s,i:0,left:s.steps[0].d,run:true,last:performance.now(),done:0,lastBeep:null,pid:S.cur};
 $("#player").hidden=false;drawPlayer();P.tick=setInterval(tick,200);beep(660,200);
}
function tick(){
 if(!P||!P.run)return;const n=performance.now(),dt=(n-P.last)/1000;P.last=n;P.left-=dt;P.done+=dt;
 const c=Math.ceil(P.left);if(c<=3&&c>=1&&P.lastBeep!==c){P.lastBeep=c;beep(740,100);}
 if(P.left<=0){go(1,true);return;}
 updClock();
}
function go(dir,auto){
 P.i+=dir;P.lastBeep=null;
 if(P.i>=P.s.steps.length){finish(true);return;}
 if(P.i<0)P.i=0;
 P.left=P.s.steps[P.i].d;P.last=performance.now();
 const k=P.s.steps[P.i].k; if(auto){beep(k==="work"?990:600,260);buzz(k==="work"?[120,60,120]:200);}
 if($("#sheet").hidden) drawPlayer();
}
const LBL={warm:"Attivazione",work:"Lavoro",rest:"Recupero",cool:"Defaticamento"};
function drawPlayer(){
 const st=P.s.steps[P.i], nx=P.s.steps.slice(P.i+1).find(x=>x.k!=="rest");
 const show = st.k==="rest" ? nx : st;          // durante il recupero si vede il prossimo esercizio
 const L = show ? cur(show.id) : null, E = show ? EX[show.id] : null;
 $("#player").innerHTML=`<div class="pbar"><i id="pb"></i></div>
 <div class="ph num"><span>${st.round?`Giro ${st.round} di ${st.rounds}`:esc(LBL[st.k])}</span><span id="rem"></span></div>
 <div class="main"><span class="phase ${st.k}">${esc(st.k==="rest"?(st.long?"Recupero lungo":"Recupero"):LBL[st.k])}</span>
  ${L?`<div class="pfig">${figSvg(L.a,true,L.n)}</div>`:""}
  <div class="clock" id="clk">${mmss(P.left)}</div>
  ${L?`<div class="exname">${st.k==="rest"?"Prossimo: ":""}${esc(L.n)}</div>`:""}
  ${L&&L.t?`<div class="target">${esc(L.t)}</div>`:""}
  ${E?`<div class="cue">${esc(E.cura[0])}</div><button class="guide" id="pg">Come si fa</button>`:""}
 </div>
 ${nx&&st.k!=="rest"?`<div class="next"><span>Dopo</span><b>${esc(cur(nx.id).n)}</b></div>`:""}
 <div class="ctrls"><button id="pv" aria-label="Esercizio precedente">Indietro</button><button class="pp" id="pp">${P.run?"Pausa":"Riprendi"}</button><button id="sk" aria-label="Salta">Salta</button></div>
 <button class="close" id="stop">Termina qui</button>`;
 $("#pv").onclick=()=>go(-1);$("#sk").onclick=()=>go(1);
 $("#pp").onclick=()=>{P.run=!P.run;P.last=performance.now();$("#pp").textContent=P.run?"Pausa":"Riprendi";if(P.run)lock();};
 $("#stop").onclick=()=>finish(false);
 const pg=$("#pg"); if(pg) pg.onclick=()=>{P.run=false;openEx(show.id,true);};
 updClock();
}
function updClock(){
 const c=$("#clk");if(!c)return;c.textContent=mmss(P.left);
 const tot=P.s.secs, past=P.s.steps.slice(0,P.i).reduce((a,s)=>a+s.d,0)+(P.s.steps[P.i].d-P.left);
 $("#pb").style.width=Math.min(100,past/tot*100)+"%";$("#rem").textContent="mancano "+mmss(tot-past);
}
function finish(full){
 clearInterval(P.tick);P.run=false;try{wake&&wake.release();}catch(e){}
 if(P.done<60){$("#player").hidden=true;P=null;return;}
 beep(880,300);
 $("#player").innerHTML=`<div class="main"><span class="phase work">${full?"Fatto":"Seduta interrotta"}</span>
 <div class="clock" style="font-size:96px">${mmss(P.done)}</div><div class="exname">${full?"Ottimo lavoro. Com'è andata?":"Va bene così. Com'è andata?"}</div>
 <div class="fb"><button data-fb="facile">Facile <span>si sale di livello</span></button><button data-fb="giusta">Giusta <span>resta così</span></button><button data-fb="dura">Dura <span>si scende di livello</span></button></div></div>`;
 $("#player").querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{
  const fb=b.dataset.fb,key=P.s.key,p=S.profiles.find(x=>x.id===P.pid)||me();
  S.cur=p.id;
  p.log.push({date:ymd(new Date()),key,secs:Math.round(P.done),fb,full});
  const prev=p.log.filter(e=>e.key===key).slice(-2);
  if(fb==="dura") P.s.ex.forEach(id=>setLv(id,lv(id)-1));
  if(fb==="facile"&&prev.length===2&&prev.every(e=>e.fb==="facile")) P.s.ex.forEach(id=>setLv(id,lv(id)+1));
  save();$("#player").hidden=true;P=null;tab="diario";render();scrollTo(0,0);
 });
}
document.addEventListener("visibilitychange",()=>{if(P&&P.run&&document.visibilityState==="visible")lock();});
render();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
